<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Magic 8 Ball</title>
        <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Ask the Magic 8 Ball</h1>
        <input type="text" id="question-input" placeholder="Type your question here...">
        <button id="shake-btn">Shake the Ball</button>

        <div id="ball" class="eight-ball">
            <div class="inner-circle">
                <div id="eight-graphic">8</div>
                <div id="answer-text" class="hidden"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
